# 不正解になってから、札を運び直す流れと、答えを見る流れ。
appId: host.exp.Exponent
---
- stopApp
- launchApp
- openLink: exp://127.0.0.1:8099
- extendedWaitUntil:
    visible: "選んだ分類で始める"
    timeout: 90000
- openLink: exp://127.0.0.1:8099/--/quiz?categories=numbers&question=numbers-001
- extendedWaitUntil:
    visible: "答え合わせ"
    timeout: 60000
# 札が1枚もなくても答え合わせができ、不正解になる
- tapOn: "答え合わせ"
- assertVisible: "不正解"
- assertVisible: "答えを見る"
- assertNotVisible: "次の問題"
# 札を運ぶと「不正解」は消え、「答えを見る」は残る
- tapOn: "hundreds"
- assertNotVisible: "不正解"
- assertVisible: "答えを見る"
# 札を運んだまま答え合わせをすると不正解になり、続けて押すたびに不正解を出し直す
- tapOn: "答え合わせ"
- assertVisible: "不正解"
- tapOn: "答え合わせ"
- assertVisible: "不正解"
# 回答エリアの札をタップすると札置き場へ戻る。並べ直して正解にする
- tapOn: "hundreds"
- tapOn: "one"
- tapOn: "hundred"
- tapOn: "答え合わせ"
- assertVisible: "正解"
- assertVisible: "ほかの読み方"
- assertNotVisible: "不正解"
