# 正解までの流れ（docs/specs/quiz.md の受け入れ条件）。
# numbers-001 は、正解が「a hundred」と「one hundred」、まぎらわしい札が「hundreds」。
appId: host.exp.Exponent
---
- stopApp
- launchApp
- openLink: exp://127.0.0.1:8099
- extendedWaitUntil:
    visible: "merb"
    timeout: 90000
- openLink: exp://127.0.0.1:8099/--/quiz?categories=numbers&question=numbers-001
- extendedWaitUntil:
    visible: "答え合わせ"
    timeout: 60000
# 札置き場の札をタップすると回答エリアへ運ばれる
- tapOn: "a"
- tapOn: "hundred"
- assertVisible: "答え合わせ"
- assertNotVisible: "次の問題"
- tapOn: "答え合わせ"
- assertVisible: "正解"
- assertVisible: "ほかの読み方"
- assertVisible: "one hundred"
# 正解のあとは札置き場を出さず、次の問題のボタンを出す
- assertNotVisible: "hundreds"
- assertNotVisible: "答え合わせ"
- assertVisible: "次の問題"
- tapOn: "次の問題"
- assertVisible: "答え合わせ"
- assertNotVisible: "正解"
