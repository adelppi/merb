# 出題の画面の戻るボタンで、選んだ分類を残したままホームへ戻る流れ。
appId: host.exp.Exponent
---
- stopApp
- launchApp
- openLink: exp://127.0.0.1:8099
- extendedWaitUntil:
    visible: "選んだ分類で始める"
    timeout: 90000
# 前の実行の保存が残っていてもよいよう、どの分類も選んでいない状態にそろえる
- runFlow:
    when:
      visible: "すべて選択"
    commands:
      - tapOn: "すべて選択"
- tapOn: "すべて解除"
- tapOn: "数"
- tapOn: "選んだ分類で始める"
- extendedWaitUntil:
    visible: "答え合わせ"
    timeout: 30000
# 戻るボタン（ヘッダーの左上）
- tapOn:
    point: 9%,9%
- extendedWaitUntil:
    visible: "すべて選択"
    timeout: 10000
# 選んだ分類が残っているので、「選んだ分類で始める」を押せる
- tapOn: "選んだ分類で始める"
- assertVisible: "答え合わせ"
